services:
  # 1. Brain API (Python ML Model)
  - type: web
    name: brain-api
    env: python
    rootDir: brain-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # 2. Orchestrator Service (Java Spring Boot)
  - type: web
    name: orchestrator-service
    env: docker
    rootDir: orchestrator-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://YOUR_USER:YOUR_PASS@your-cluster.mongodb.net/phishing_detection?retryWrites=true&w=majority
      - key: BRAIN_API_URL
        value: https://brain-api-XXXX.onrender.com/predict
