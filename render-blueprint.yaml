services:
  # 1. Brain API (Python ML Model)
  - type: web
    name: brain-api
    env: python
    plan: free
    rootDir: brain-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # 2. Orchestrator Service (Java Spring Boot)
  - type: web
    name: orchestrator-service
    env: java
    plan: free
    rootDir: orchestrator-service
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: BRAIN_API_URL
        # Automatically link the Python service's URL to the Java service
        fromService:
          type: web
          name: brain-api
          envVarKey: RENDER_EXTERNAL_URL
